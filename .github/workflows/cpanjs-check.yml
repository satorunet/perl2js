name: CPANjs check
on:
  pull_request:
    paths: ['cpanjs/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # the checker and the compiler come from the current main branch, only cpanjs/ comes from the Pull Request
      - uses: actions/checkout@v4
        with: { ref: '${{ github.event.pull_request.base.sha }}', path: base }
      - uses: actions/checkout@v4
        with: { path: pr, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Only cpanjs/lib and cpanjs/t may change
        working-directory: pr
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          OWNER: ${{ github.repository_owner }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          [ "$AUTHOR" = "$OWNER" ] && exit 0
          files=$(git diff --name-only --no-renames "$BASE...HEAD")
          if echo "$files" | grep -Ev '^cpanjs/(lib|t)/'; then
            echo "::error::モジュールの登録 Pull Request で変更できるのは cpanjs/lib/ と cpanjs/t/ だけです"
            exit 1
          fi
      - name: Check modules, ownership and tests
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          OWNER: ${{ github.repository_owner }}
        run: node base/tools/cpanjs.js check --root pr/cpanjs --base base/cpanjs --author "$AUTHOR" --admin "$OWNER"
