<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" width="440" height="360" role="img" aria-label="Dromi, the Perl2JS camel">
  <title>Dromi - the Perl2JS camel</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1446"/><stop offset="1" stop-color="#0b1022"/>
    </linearGradient>
    <linearGradient id="sig" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="js" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fde047"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6cf8e"/><stop offset="1" stop-color="#e2a35a"/></linearGradient>
    <linearGradient id="furDark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9a05a"/><stop offset="1" stop-color="#c58a45"/></linearGradient>
    <radialGradient id="belly" cx=".5" cy=".3" r=".7"><stop offset="0" stop-color="#fbe6bd"/><stop offset="1" stop-color="#fbe6bd" stop-opacity="0"/></radialGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="228" cy="332" rx="160" ry="12" fill="#0b1022" opacity=".22"/>

  <!-- far legs (darker) -->
  <g fill="url(#furDark)">
    <rect x="170" y="220" width="26" height="106" rx="12"/><rect x="290" y="220" width="26" height="106" rx="12"/>
  </g>
  <g fill="#6b4a2b"><rect x="169" y="314" width="28" height="14" rx="7"/><rect x="289" y="314" width="28" height="14" rx="7"/></g>

  <!-- tail -->
  <path d="M120 188 C90 194 80 224 92 252" fill="none" stroke="#d9a05a" stroke-width="11" stroke-linecap="round"/>
  <ellipse cx="92" cy="260" rx="10" ry="15" fill="#8a5a2b" transform="rotate(8 92 260)"/>

  <!-- neck (overlaps the body so it blends in) -->
  <path d="M282 196 C298 154 304 118 324 90 L380 108 C368 142 368 182 350 226 C334 252 296 246 282 222 Z" fill="url(#fur)"/>

  <!-- body + hump -->
  <ellipse cx="226" cy="190" rx="118" ry="72" fill="url(#fur)"/>
  <ellipse cx="218" cy="132" rx="62" ry="46" fill="url(#fur)"/>
  <ellipse cx="226" cy="224" rx="86" ry="30" fill="url(#belly)"/>

  <!-- saddle blanket with >> -->
  <g>
    <path d="M168 146 Q222 128 280 146 L290 218 Q226 234 160 218 Z" fill="url(#js)"/>
    <path d="M168 146 Q222 128 280 146 L290 218 Q226 234 160 218 Z" fill="none" stroke="#0b1022" stroke-opacity=".35" stroke-width="3"/>
    <g fill="none" stroke="#1b1446" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M196 164 L216 184 L196 204"/><path d="M224 164 L244 184 L224 204" opacity=".5"/>
    </g>
    <g fill="#1b1446" opacity=".5"><circle cx="176" cy="226" r="3.3"/><circle cx="192" cy="230" r="3.3"/><circle cx="208" cy="233" r="3.3"/><circle cx="244" cy="233" r="3.3"/><circle cx="260" cy="230" r="3.3"/><circle cx="276" cy="226" r="3.3"/></g>
  </g>

  <!-- $ badge on the hump -->
  <circle cx="218" cy="118" r="25" fill="url(#bg)"/>
  <circle cx="218" cy="118" r="24" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="2"/>
  <g transform="translate(207.16 130)"><path d="M12.2 -9.28V-3.97Q13.31 -4.13 13.92 -4.83Q14.54 -5.52 14.54 -6.59Q14.54 -7.68 13.93 -8.38Q13.32 -9.07 12.2 -9.28ZM9.72 -14.36V-19.34Q8.63 -19.2 8.08 -18.61Q7.52 -18.02 7.52 -17Q7.52 -16 8.08 -15.33Q8.63 -14.66 9.72 -14.36ZM12.2 5.29H9.72L9.7 0Q8.17 -0.05 6.5 -0.46Q4.83 -0.86 3.02 -1.62V-6.22Q4.83 -5.15 6.53 -4.57Q8.23 -3.99 9.72 -3.97V-9.76Q6.26 -10.44 4.57 -12.12Q2.88 -13.8 2.88 -16.56Q2.88 -19.49 4.68 -21.23Q6.47 -22.97 9.72 -23.19V-27.35H12.2L12.22 -23.19Q13.46 -23.12 14.81 -22.87Q16.15 -22.62 17.56 -22.18V-17.68Q16.47 -18.39 15.13 -18.81Q13.8 -19.23 12.2 -19.34V-13.94Q15.66 -13.39 17.43 -11.58Q19.2 -9.76 19.2 -6.73Q19.2 -3.85 17.29 -2Q15.38 -0.16 12.22 0Z" fill="url(#sig)"/></g>

  <!-- near legs -->
  <g fill="url(#fur)">
    <rect x="134" y="226" width="30" height="100" rx="13"/><rect x="256" y="226" width="30" height="100" rx="13"/>
  </g>
  <g fill="#7a5632"><rect x="133" y="314" width="32" height="14" rx="7"/><rect x="255" y="314" width="32" height="14" rx="7"/></g>

  <!-- head -->
  <g transform="translate(0 -6) rotate(-8 352 92)">
    <ellipse cx="350" cy="90" rx="36" ry="30" fill="url(#fur)"/>
    <ellipse cx="382" cy="102" rx="26" ry="21" fill="#f8dcae"/>
    <ellipse cx="337" cy="64" rx="8" ry="15" fill="#e2a35a" transform="rotate(-18 337 64)"/>
    <ellipse cx="337" cy="66" rx="4" ry="9" fill="#f3b8a0" transform="rotate(-18 337 66)"/>
    <ellipse cx="392" cy="98" rx="3.4" ry="2.4" fill="#6b4a2b"/>
    <path d="M374 112 Q386 120 398 110" fill="none" stroke="#6b4a2b" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="364" cy="108" rx="9" ry="6" fill="#ff8fa3" opacity=".55"/>
    <ellipse cx="352" cy="82" rx="8.5" ry="9.5" fill="#1b1446"/>
    <circle cx="355" cy="78" r="3.2" fill="#ffffff"/><circle cx="349.5" cy="86" r="1.5" fill="#ffffff" opacity=".8"/>
    <path d="M343 72 Q348 66 355 68" fill="none" stroke="#1b1446" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M341 76 L336 73" stroke="#1b1446" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- sparkles -->
  <g fill="#fde047" opacity=".9">
    <path d="M64 92 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4z"/>
    <path d="M402 196 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
  </g>
  <g fill="#22d3ee" opacity=".85"><circle cx="84" cy="160" r="4"/><circle cx="420" cy="150" r="3"/><circle cx="44" cy="218" r="3"/></g>
</svg>
